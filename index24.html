<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows</title>
    <style>
        #container {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            box-shadow: 10px 10px 5px grey;
            padding: 50px;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 2px solid black;
            text-shadow: 2px 2px 4px #000000;
    outline: 3px solid red;
     outline-offset: 5px;  </style>
</head>
<body>
    <div id="container">
        I am a div with a shadow.
    </div>
</body>
</html>
